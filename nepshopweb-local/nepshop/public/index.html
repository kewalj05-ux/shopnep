<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEPSHOPWEB – Game Top-Up Nepal</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#14162b;--mu:#6b6f8a;--bd:#e4e6f2;--ac:#7c3aed;--ac2:#06b6d4;--ok:#16a34a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d17;--card:#141729;--tx:#eef0ff;--mu:#8e93b5;--bd:#23274a}}
:root[data-theme="dark"]{--bg:#0b0d17;--card:#141729;--tx:#eef0ff;--mu:#8e93b5;--bd:#23274a}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:19;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
.w{max-width:1100px;margin:auto;padding:0 18px}.nav{display:flex;align-items:center;justify-content:space-between;height:60px;gap:8px}
.logo{font-weight:800;font-size:19px;cursor:pointer;white-space:nowrap}.logo b{background:linear-gradient(90deg,var(--ac),var(--ac2),var(--ac));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite}
@keyframes sh{to{background-position:200%}}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;transition:transform .15s,box-shadow .2s;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(124,58,237,.35)}.btn:active{transform:scale(.95)}.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.hero{margin:22px 0;border-radius:24px;padding:46px 28px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,#4c1d95,#7c3aed 60%,#2563eb)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(40px);animation:fl 7s ease-in-out infinite}
.hero::before{width:260px;height:260px;background:#06b6d4aa;right:-40px;top:-60px}.hero::after{width:200px;height:200px;background:#ec4899aa;right:25%;bottom:-90px;animation-delay:-3s}
@keyframes fl{50%{transform:translate(-30px,25px) scale(1.15)}}
.hero>*{position:relative;z-index:1}.hero h1{margin:0 0 8px;font-size:clamp(26px,5vw,42px);line-height:1.15}.hero p{margin:0 0 18px;opacity:.92;max-width:520px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.chip{background:#ffffff26;border-radius:99px;padding:5px 12px;font-size:13px;animation:up .6s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.rv{opacity:0;transform:translateY(24px);transition:.6s}.rv.in{opacity:1;transform:none}
h2{margin:26px 0 12px;font-size:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s}
.card:hover{transform:translateY(-6px) rotate(-.6deg);box-shadow:0 14px 30px rgba(80,60,200,.2);border-color:var(--ac)}.card:active{transform:scale(.96)}
.pfp{width:100%;aspect-ratio:1;border-radius:14px;display:grid;place-items:center;font-size:40px;font-weight:800;margin-bottom:10px;color:#fff;position:relative;overflow:hidden;background-size:cover;background-position:center}
.pfp::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,#ffffff45,transparent 70%);transform:translateX(-100%);transition:transform .6s}.card:hover .pfp::after{transform:translateX(100%)}
.card small,.mu{color:var(--mu)}.back{background:none;border:0;color:var(--mu);cursor:pointer;margin:18px 0 0;padding:0}
.shead{display:flex;gap:16px;align-items:center;margin:14px 0}.shead .pfp{width:84px;margin:0}
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pack{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:14px;cursor:pointer;text-align:left;transition:.15s}.pack:hover{border-color:var(--ac);transform:translateY(-2px)}
.pack.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,var(--card))}.pack b{display:block}.pack span{color:var(--ac);font-weight:700}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-top:14px}
input,select,textarea{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);margin:6px 0 12px}input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);border-color:transparent}
label{font-size:13px;color:var(--mu);font-weight:600}.pm{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin:6px 0 14px}
.pm div{border:2px solid var(--bd);border-radius:12px;padding:10px;text-align:center;cursor:pointer;font-weight:700;transition:.15s}.pm div.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,var(--bg))}
.note{background:color-mix(in srgb,var(--ac2) 12%,var(--bg));border-radius:12px;padding:12px;margin-bottom:12px;font-size:14px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:30px 0}.feat div{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px}
footer{text-align:center;color:var(--mu);padding:30px 0 90px;font-size:13px}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--bd);font-size:14px;vertical-align:top}th{color:var(--mu)}td input,td select{margin:0;padding:6px 8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px}.stat b{font-size:26px;display:block}
.tabs{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}.tag{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:#f59e0b22;color:#d97706}.tag.ok{background:#16a34a22;color:var(--ok)}.tag.h{background:#ef444422;color:#dc2626}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:70;display:none}
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;font-size:26px;cursor:pointer;z-index:40;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 8px 24px rgba(124,58,237,.5);animation:pu 2.5s infinite}
@keyframes pu{50%{box-shadow:0 0 0 12px rgba(124,58,237,0)}}
#chat{position:fixed;right:16px;bottom:calc(86px + env(safe-area-inset-bottom,0px));width:min(370px,calc(100vw - 32px));height:min(520px,calc(100% - 140px));background:var(--card);border:1px solid var(--bd);border-radius:20px;display:none;flex-direction:column;z-index:41;box-shadow:0 20px 50px #0004;overflow:hidden;animation:up .25s}
#chat.on{display:flex}.ch{padding:12px 16px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.cm{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}.m{max-width:82%;padding:8px 12px;border-radius:14px;font-size:14px;white-space:pre-wrap;word-break:break-word;animation:up .2s}
.m.u{align-self:flex-end;background:var(--ac);color:#fff}.m.ai,.m.a{align-self:flex-start;background:var(--bg);border:1px solid var(--bd)}.m.a{border-color:var(--ac)}.m small{display:block;opacity:.6;font-size:11px}
.cf{display:flex;gap:6px;padding:10px;border-top:1px solid var(--bd)}.cf input{margin:0}.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--mu);animation:bn 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes bn{50%{transform:translateY(-5px)}}
.adm{display:grid;grid-template-columns:200px 1fr;gap:12px}@media(max-width:700px){.adm{grid-template-columns:1fr}}.li{padding:9px;border-radius:10px;cursor:pointer;border:1px solid var(--bd);margin-bottom:6px}.li.sel{border-color:var(--ac)}
.cbn{display:none;align-items:center;gap:8px;padding:8px 14px;background:color-mix(in srgb,var(--ok) 12%,var(--card));font-size:13px;font-weight:600;color:var(--ok)}
.gd{display:inline-block;width:10px;height:10px;border-radius:50%;background:#22c55e;margin-right:6px;animation:gp 1.4s infinite;vertical-align:middle;flex:none}
@keyframes gp{0%{box-shadow:0 0 0 0 rgba(34,197,94,.7)}70%{box-shadow:0 0 0 10px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.chips2{display:flex;flex-wrap:wrap;gap:6px}.chips2 button{border:1px solid var(--ac);background:none;color:var(--ac);border-radius:99px;padding:5px 11px;font-size:13px;cursor:pointer;transition:.15s}.chips2 button:hover{background:var(--ac);color:#fff;transform:translateY(-1px)}
.srch input{padding:15px 18px;border-radius:16px;font-size:16px;margin:4px 0 12px;box-shadow:0 4px 18px rgba(124,58,237,.12);transition:box-shadow .2s}.srch input:focus{box-shadow:0 6px 26px rgba(124,58,237,.3)}
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.pill{flex:none;border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:8px 16px;font-weight:700;cursor:pointer;transition:.2s;color:var(--tx)}
.pill:hover{transform:translateY(-2px);border-color:var(--ac)}.pill.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(124,58,237,.35)}
</style></head><body>

<main class="w" id="app"></main><footer>© NEPSHOPWEB · Instant game top-ups in Nepal 🇳🇵</footer>
